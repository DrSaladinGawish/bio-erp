[project]
name = "bio-erp"
version = "5.3.0"
description = "BIO_ERP — Enterprise Resource Planning system with FastAPI backend, SQLAlchemy ORM, and React frontend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "slowapi>=0.1.9",
    "itsdangerous==2.2.0",
    "prometheus-client>=0.25.0",
    "apscheduler>=3.10.4",
    "structlog>=24.1.0",
    "celery[redis]>=5.4.0",
    "casbin>=1.30.0",
]

[tool.ruff]
exclude = ["incentivehouse_erp_master_v3.py"]
