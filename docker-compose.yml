# =============================================================================
# IncentiveHouse ERP v5.5 - Docker Compose (Production)
# Services: PostgreSQL, App, Nginx (SSL reverse proxy)
# =============================================================================

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    container_name: ih-erp-db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bio_erp}
      POSTGRES_USER: ${POSTGRES_USER:-bioerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioerp} -d ${POSTGRES_DB:-bio_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ihnet

  # ── ERP Application ──
  erp:
    build: .
    container_name: ih-erp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bioerp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bio_erp}
      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      IH_JWT_SECRET: ${IH_JWT_SECRET:-${JWT_SECRET}}
      IH_ADMIN_PASSWORD: ${IH_ADMIN_PASSWORD:-admin2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      # App
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: 9001
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      # CORS
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://localhost,https://erp.example.com}
      # ETA (Egyptian Tax Authority)
      ETA_BASE_URL: ${ETA_BASE_URL:-https://api.preprod.eta.gov.eg}
      ETA_CLIENT_ID: ${ETA_CLIENT_ID:-}
      ETA_CLIENT_SECRET: ${ETA_CLIENT_SECRET:-}
      ETA_PRIVATE_KEY_PATH: ${ETA_PRIVATE_KEY_PATH:-./keys/eta_private.pem}
      ETA_PUBLIC_KEY_PATH: ${ETA_PUBLIC_KEY_PATH:-./keys/eta_public.pem}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Redis / Celery
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - ihnet

  # ── Nginx Reverse Proxy (SSL) ──
  nginx:
    image: nginx:1.25-alpine
    container_name: ih-erp-nginx
    restart: unless-stopped
    depends_on:
      erp:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - ihnet

  # ── Redis (caching + Celery broker) ──
  redis:
    image: redis:7-alpine
    container_name: ih-erp-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ihnet

volumes:
  pgdata:
  app_data:
  app_uploads:
  app_logs:

networks:
  ihnet:
    driver: bridge
