{% extends "base.html" %}
{% block title %}Profit & Loss - IncentiveHouse ERP{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/">Dashboard</a> &raquo; <a href="/reports">Reports</a> &raquo; Profit & Loss</div>
<div class="page-header">
    <h1>Profit & Loss Statement</h1>
    <div class="actions">
        <button class="btn btn-ghost" onclick="exportReport('csv')">Export CSV</button>
        <button class="btn btn-primary" onclick="refreshReport()">Refresh</button>
    </div>
</div>
<div class="content-card">
    <div class="form-row">
        <div class="form-group"><label>From</label><input type="date" id="fFrom"></div>
        <div class="form-group"><label>To</label><input type="date" id="fTo"></div>
        <div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" onclick="loadReport()">Run</button></div>
    </div>
</div>
<div class="kpi-grid" id="plKpis"></div>
<div class="content-card" id="plDetail"></div>
{% endblock %}
{% block extra_scripts %}
<script>
async function loadReport(){
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    const params = new URLSearchParams();
    if(from) params.set('date_from', from);
    if(to) params.set('date_to', to);
    const res = await fetch('/api/v1/financial-reports/profit-loss?' + params.toString());
    const d = await res.json();
    document.getElementById('plKpis').innerHTML = `
        <div class="kpi-card kpi-revenue"><div class="kpi-label">Total Revenue</div><div class="kpi-value">EGP ${d.revenue.total_revenue.toFixed(2)}</div></div>
        <div class="kpi-card kpi-expense"><div class="kpi-label">Total Expenses</div><div class="kpi-value">EGP ${d.expenses.total_expenses.toFixed(2)}</div></div>
        <div class="kpi-card kpi-profit"><div class="kpi-label">Gross Profit</div><div class="kpi-value">EGP ${d.gross_profit.toFixed(2)}</div></div>
        <div class="kpi-card kpi-active"><div class="kpi-label">Profit Margin</div><div class="kpi-value">${d.profit_margin}%</div></div>`;
    document.getElementById('plDetail').innerHTML = `
        <h3>Revenue</h3>
        <table class="data-table"><tr><td>Sales Invoices</td><td style="text-align:right">EGP ${d.revenue.sales_invoices.toFixed(2)}</td></tr>
        <tr><td>Event Revenue</td><td style="text-align:right">EGP ${d.revenue.event_revenue.toFixed(2)}</td></tr>
        <tr style="font-weight:700"><td>Total Revenue</td><td style="text-align:right">EGP ${d.revenue.total_revenue.toFixed(2)}</td></tr></table>
        <h3 style="margin-top:16px">Expenses</h3>
        <table class="data-table"><tr><td>Purchases</td><td style="text-align:right">EGP ${d.expenses.purchases.toFixed(2)}</td></tr>
        <tr style="font-weight:700"><td>Total Expenses</td><td style="text-align:right">EGP ${d.expenses.total_expenses.toFixed(2)}</td></tr></table>
        <h3 style="margin-top:16px">Summary</h3>
        <table class="data-table" style="font-size:1.1em">
        <tr style="font-weight:700;background:#e8f5e9"><td>Gross Profit</td><td style="text-align:right">EGP ${d.gross_profit.toFixed(2)}</td></tr>
        <tr style="font-weight:700;background:#e3f2fd"><td>Profit Margin</td><td style="text-align:right">${d.profit_margin}%</td></tr></table>`;
}
function exportReport(fmt){
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    const params = new URLSearchParams({format: fmt});
    if(from) params.set('date_from', from);
    if(to) params.set('date_to', to);
    window.open('/api/v1/financial-reports/profit-loss/export?' + params.toString(), '_blank');
}
document.addEventListener('DOMContentLoaded', loadReport);
</script>
{% endblock %}
