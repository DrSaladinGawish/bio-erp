{% extends "base.html" %}
{% block title %}Balance Sheet - IncentiveHouse ERP{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/">Dashboard</a> &raquo; <a href="/reports">Reports</a> &raquo; Balance Sheet</div>
<div class="page-header">
    <h1>Balance Sheet</h1>
    <div class="actions">
        <button class="btn btn-ghost" onclick="exportReport('csv')">Export CSV</button>
        <button class="btn btn-primary" onclick="refreshReport()">Refresh</button>
    </div>
</div>
<div class="content-card">
    <div class="form-row">
        <div class="form-group"><label>As of Date</label><input type="date" id="fDate"></div>
        <div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" onclick="loadReport()">Run</button></div>
    </div>
</div>
<div class="content-card" id="bsContent"></div>
{% endblock %}
{% block extra_scripts %}
<script>
async function loadReport(){
    const asOf = document.getElementById('fDate').value;
    const params = new URLSearchParams();
    if(asOf) params.set('as_of_date', asOf);
    const res = await fetch('/api/v1/financial-reports/balance-sheet?' + params.toString());
    const d = await res.json();
    document.getElementById('bsContent').innerHTML = `
        <h3>Balance Sheet <span style="font-weight:400;font-size:0.85em">as of ${d.as_of_date}</span></h3>
        <table class="data-table">
            <tr style="background:#e3f2fd"><th colspan="2">ASSETS</th></tr>
            <tr><td>Accounts Receivable</td><td style="text-align:right">EGP ${d.assets.accounts_receivable.toFixed(2)}</td></tr>
            <tr><td>Cash & Bank</td><td style="text-align:right">EGP ${d.assets.cash_and_bank.toFixed(2)}</td></tr>
            <tr style="font-weight:700"><td>Total Assets</td><td style="text-align:right">EGP ${d.assets.total_assets.toFixed(2)}</td></tr>
            <tr style="background:#fff3e0"><th colspan="2">LIABILITIES</th></tr>
            <tr><td>Accounts Payable</td><td style="text-align:right">EGP ${d.liabilities.accounts_payable.toFixed(2)}</td></tr>
            <tr style="font-weight:700"><td>Total Liabilities</td><td style="text-align:right">EGP ${d.liabilities.total_liabilities.toFixed(2)}</td></tr>
            <tr style="background:#e8f5e9"><th colspan="2">EQUITY</th></tr>
            <tr><td>Retained Earnings</td><td style="text-align:right">EGP ${d.equity.retained_earnings.toFixed(2)}</td></tr>
            <tr style="font-weight:700"><td>Total Equity</td><td style="text-align:right">EGP ${d.equity.total_equity.toFixed(2)}</td></tr>
            <tr style="font-weight:700;background:#f5f5f5"><td>Total Liabilities + Equity</td><td style="text-align:right">EGP ${d.total_liabilities_equity.toFixed(2)}</td></tr>
        </table>`;
}
function exportReport(fmt){
    const asOf = document.getElementById('fDate').value;
    const params = new URLSearchParams({format: fmt});
    if(asOf) params.set('as_of_date', asOf);
    window.open('/api/v1/financial-reports/balance-sheet/export?' + params.toString(), '_blank');
}
document.addEventListener('DOMContentLoaded', loadReport);
</script>
{% endblock %}
