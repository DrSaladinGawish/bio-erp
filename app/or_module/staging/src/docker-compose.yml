version: '3.8'

services:
  or-erp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: or-erp-microservice
    ports:
      - "8010:8010"
    environment:
      - PORT=8010
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    volumes:
      - ./or_erp_module.py:/app/or_erp_module.py:ro
      - ./main.py:/app/main.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

