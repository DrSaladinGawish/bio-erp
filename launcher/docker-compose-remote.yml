# ============================================================================
#  IncentiveHouse ERP - Docker Compose for REMOTE/LAN access
#  Binds to 0.0.0.0 so phones/laptops on the same WiFi can reach the ERP.
#  Run: docker-compose -f docker-compose-remote.yml up --build
# ============================================================================
version: "3.9"

services:
  erp:
    build: .
    container_name: ih-erp-app
    restart: unless-stopped
    # BIND 0.0.0.0 = accessible from any network interface (LAN, WiFi, etc.)
    ports:
      - "0.0.0.0:9001:9001"   # main ERP API
    environment:
      - DB_URL=sqlite:////data/app.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-prod}
      - ALLOWED_HOSTS=*
      - ENV=production
    volumes:
      # Persistent database & uploads
      - ih_data:/data
      - ih_uploads:/app/uploads
      - ih_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ihnet

  nginx:
    image: nginx:1.25-alpine
    container_name: ih-erp-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"       # reverse proxy on port 80
    depends_on:
      erp:
        condition: service_healthy
    volumes:
      - ./nginx-remote.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ihnet

volumes:
  ih_data:
  ih_uploads:
  ih_logs:

networks:
  ihnet:
    driver: bridge
